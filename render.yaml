# Render Blueprint for the CardCraft backend.
# Secrets use sync: false, so Render asks for them in the dashboard
# and they never live in this file.
services:
  - type: web
    name: card-craft-server
    runtime: node
    region: singapore
    plan: free
    rootDir: card-craft-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
